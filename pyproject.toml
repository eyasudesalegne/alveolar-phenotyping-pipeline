[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alveolar-phenotyping-pipeline"
version = "0.2.0"
description = "Reproducible high-content image phenotyping pipeline for alveolar epithelial screening workflows"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Eyasu Desalegne Beyene"}]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-image>=0.22",
  "scikit-learn>=1.4",
  "PyYAML>=6.0",
  "joblib>=1.3"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
plot = ["matplotlib>=3.8"]

[project.scripts]
alveolar-pheno = "alveolar_pheno.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
